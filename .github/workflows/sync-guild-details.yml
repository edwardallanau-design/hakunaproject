name: Sync Guild Details

on:
  # Restored 2026-08-25, after the Season 2 row was created in production and
  # `guild-settings.currentSeason` moved to it. Removed on 2026-08-11 for the
  # rollover: while the pointer still named Season 1, an hourly Sync would have
  # overwritten its M+ leaderboard with Season 2 keys. That can no longer
  # happen — Season 1 is archived and is not a Sync target.
  #
  # This is rollover ticket `10`. The route-side `SYNC_DISABLED` kill switch is
  # the other half and is cleared in Vercel, not here; until it is, every run
  # below fails with 503 by design.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger guild details sync
        run: |
          echo "Running guild details sync at $(date -u '+%Y-%m-%d %H:%M:%S UTC')"
          response=$(curl -s -o /dev/null -w "%{http_code}" \
            -H "Authorization: Bearer ${{ secrets.CRON_SECRET }}" \
            https://hakunaproject.vercel.app/api/sync-guild-details)
          echo "Response status: $response"
          if [ "$response" != "200" ]; then
            echo "Sync failed with status $response"
            exit 1
          fi
          echo "Sync completed successfully"
